server:
  port: 8083

spring:
  application:
    name: ms-despacho-ordenes
  datasource:
    url: jdbc:mysql://localhost:3307/bd_despacho?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/