server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: route-ms-despacho
          uri: lb://MS-DESPACHO-ORDENES
          predicates:
            - Path=/api/despachos/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/