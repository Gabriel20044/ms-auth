@if (auth.isLoggedIn()) {
<div class="app-layout">
  <!-- Sidebar Lateral Izquierda -->
  <aside class="sidebar">
    <!-- Marca / Logo superior -->
    <div class="sidebar-brand">
      <img src="/logo.png" alt="LogiSpeed Logo" class="brand-logo" />
    </div>

    <!-- Menú de Navegación -->
    <nav class="sidebar-nav">
      <a routerLink="/clientes" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Clientes</span>
      </a>

      <a routerLink="/paquetes" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line>
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>Paquetes</span>
      </a>
    </nav>

    <!-- Perfil de usuario y Logout -->
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar">{{ auth.currentUser()?.charAt(0)?.toUpperCase() || 'U' }}</div>
        <span class="username">{{ auth.currentUser() }}</span>
      </div>
      <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Área Principal de Contenido (Módulo Activo) -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
} @else {
<!-- Vistas públicas sin barra lateral (ej. Login) -->
<router-outlet />
}
